<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Chopper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔪 Sample Chopper</h1>
            <p>Automatically chop audio files at silence points</p>
        </header>

        <div class="upload-section" id="uploadSection">
            <div class="upload-box" id="uploadBox">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>Drop audio file here or click to browse</p>
                <p class="supported-formats">Supported: WAV, AIFF, MP3</p>
                <input type="file" id="fileInput" accept="audio/*" hidden>
            </div>
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <label for="threshold">Silence Threshold (dB): <span id="thresholdValue">-40</span></label>
                <input type="range" id="threshold" min="-60" max="-20" value="-40" step="1">
            </div>
            <div class="control-group">
                <label for="minDuration">Min Silence Duration (ms): <span id="minDurationValue">50</span></label>
                <input type="range" id="minDuration" min="10" max="200" value="50" step="10">
            </div>
            <div class="control-group">
                <label for="minDistance">Min Distance Between Chops (ms): <span id="minDistanceValue">100</span></label>
                <input type="range" id="minDistance" min="50" max="500" value="100" step="50">
            </div>
            <div class="control-buttons">
                <button id="reanalyze" class="btn btn-secondary">Re-analyze</button>
                <button id="exportAll" class="btn btn-primary">Export All Samples</button>
            </div>
        </div>

        <div class="waveform-container" id="waveformContainer" style="display: none;">
            <div class="waveform-info">
                <span id="fileName"></span>
                <span id="chopCount">0 chops detected</span>
            </div>
            <canvas id="waveformCanvas"></canvas>
            <div class="playback-controls">
                <button id="playPause" class="btn btn-small">▶ Play</button>
                <span id="playbackTime">0:00 / 0:00</span>
            </div>
        </div>

        <div class="samples-list" id="samplesList" style="display: none;">
            <h3>Chopped Samples</h3>
            <div id="samplesContainer"></div>
        </div>
    </div>

    <script src="audio-processor.js"></script>
    <script src="waveform-renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
